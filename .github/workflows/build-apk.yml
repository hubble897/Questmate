name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the files from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract the Android project
      - name: Extract QuestMate
        run: |
          rm -rf project
          mkdir project
          unzip QuestMate-Android-Prototype.zip -d project

      # 3. Make sure AndroidX is enabled
      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      # 4. Set Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 5. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Show the project structure
      - name: Check project
        working-directory: project
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 3 -type f | sort
          echo "===== GRADLE ====="
          gradle --version

      # 7. Build the debug APK
      - name: Build QuestMate APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 8. Find the APK
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find project -type f -name "*.apk" -print

      # 9. Upload the APK
      - name: Upload QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
