name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract the QuestMate Android project
      - name: Extract QuestMate
        run: |
          rm -rf project
          mkdir project
          unzip QuestMate-Android-Prototype.zip -d project

      # 3. Enable AndroidX
      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      # 4. FIX JAVA / KOTLIN JVM TARGET
      - name: Fix JVM compatibility
        run: |
          echo "===== BEFORE FIX ====="
          cat project/app/build.gradle.kts

          # Change Java 1.8 to Java 17
          sed -i 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' project/app/build.gradle.kts

          # Change Kotlin 1.8 target to 17 if present
          sed -i 's/jvmTarget = "1\.8"/jvmTarget = "17"/g' project/app/build.gradle.kts
          sed -i "s/jvmTarget = '1\.8'/jvmTarget = '17'/g" project/app/build.gradle.kts

          # Add Java 17 settings if compileOptions are not already present
          if ! grep -q "sourceCompatibility = JavaVersion.VERSION_17" project/app/build.gradle.kts; then
            cat >> project/app/build.gradle.kts <<'EOF'

          // QuestMate Java/Kotlin compatibility
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          fi

          echo "===== AFTER FIX ====="
          cat project/app/build.gradle.kts

      # 5. Set Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 6. Set Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Check Gradle
      - name: Check Gradle
        working-directory: project
        run: |
          java -version
          gradle --version

      # 8. Build APK
      - name: Build QuestMate APK
        working-directory: project
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      # 9. Find APK
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find project -type f -name "*.apk" -print

      # 10. Upload APK
      - name: Upload QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
