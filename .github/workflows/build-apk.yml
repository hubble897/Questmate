name: Build QuestMate - OSRS Wiki Quest Helper

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build QuestMate APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. DOWNLOAD PROJECT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. EXTRACT QUESTMATE
      # =========================================================

      - name: Extract QuestMate Android project
        run: |
          echo "Extracting QuestMate..."

          rm -rf project
          mkdir project

          unzip QuestMate-Android-Prototype.zip -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | sort


      # =========================================================
      # 3. ANDROIDX
      # =========================================================

      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties


      # =========================================================
      # 4. ENABLE INTERNET FOR OSRS WIKI
      # =========================================================

      - name: Enable Wiki internet access
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("project/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              text = manifest.read_text()

              permission = '<uses-permission android:name="android.permission.INTERNET" />'

              if "android.permission.INTERNET" not in text:
                  text = text.replace(
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n\n    ' + permission
                  )

                  manifest.write_text(text)

                  print("Internet permission added.")
              else:
                  print("Internet permission already exists.")
          else:
              print("WARNING: AndroidManifest.xml not found.")
          PY


      # =========================================================
      # 5. JAVA / KOTLIN JVM 17 FIX
      # =========================================================

      - name: Configure Java and Kotlin JVM 17
        run: |
          echo "===== BUILD.GRADLE.KTS BEFORE FIX ====="

          cat project/app/build.gradle.kts

          echo ""
          echo "===== APPLYING JVM 17 FIX ====="

          # Convert old Java 8 settings to Java 17
          sed -i \
            's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
            project/app/build.gradle.kts

          # Convert old Kotlin 1.8 settings to Kotlin 17
          sed -i \
            's/jvmTarget = "1\.8"/jvmTarget = "17"/g' \
            project/app/build.gradle.kts

          sed -i \
            "s/jvmTarget = '1\.8'/jvmTarget = '17'/g" \
            project/app/build.gradle.kts


          # Add Java 17 / Kotlin 17 configuration if required
          if ! grep -q "sourceCompatibility = JavaVersion.VERSION_17" project/app/build.gradle.kts; then

            cat >> project/app/build.gradle.kts <<'EOF'

          // =====================================================
          // QUESTMATE JVM COMPATIBILITY
          // =====================================================

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          fi


          echo ""
          echo "===== BUILD.GRADLE.KTS AFTER FIX ====="

          cat project/app/build.gradle.kts


      # =========================================================
      # 6. CHECK OVERLAY CONFIGURATION
      # =========================================================

      - name: Check overlay configuration
        run: |
          echo "===== ANDROID MANIFEST ====="

          cat project/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "===== OVERLAY REFERENCES ====="

          grep -R \
            -E "SYSTEM_ALERT_WINDOW|TYPE_APPLICATION_OVERLAY|foregroundServiceType|QuestOverlayService" \
            project/app/src/main \
            || true


      # =========================================================
      # 7. JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 8. GRADLE 8.9
      # =========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # =========================================================
      # 9. CHECK ENVIRONMENT
      # =========================================================

      - name: Check Java and Gradle
        working-directory: project
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version


      # =========================================================
      # 10. SHOW AVAILABLE GRADLE TASKS
      # =========================================================

      - name: Check Gradle tasks
        working-directory: project
        run: |
          gradle tasks --all


      # =========================================================
      # 11. BUILD QUESTMATE
      # =========================================================

      - name: Build QuestMate APK
        working-directory: project
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 12. FIND APK
      # =========================================================

      - name: Find APK
        run: |
          echo "================================="
          echo "QUESTMATE APK FILES"
          echo "================================="

          find project \
            -type f \
            -name "*.apk" \
            -print


      # =========================================================
      # 13. UPLOAD APK
      # =========================================================

      - name: Upload QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-OSRS-Wiki-Quest-Helper
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
