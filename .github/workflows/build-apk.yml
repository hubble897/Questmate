name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract QuestMate
        run: |
          rm -rf project
          mkdir project
          unzip QuestMate-Android-Prototype.zip -d project

      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      - name: Fix Java and Kotlin JVM targets
        run: |
          cat >> project/app/build.gradle.kts <<'EOF'

          // QuestMate JVM compatibility fix
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Gradle tasks
        working-directory: project
        run: |
          gradle tasks --all

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Looking for APK..."
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
